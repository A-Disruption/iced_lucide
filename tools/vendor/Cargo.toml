[package]
name = "vendor"
version = "0.1.0"
edition = "2024"
publish = false
description = "Maintainer tool: fetches upstream icon fonts and normalises them into assets/"

[dependencies]
flate2 = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ttf-parser = "0.25"
subsetter = "0.2"
ureq = "3"
zip = { version = "8", default-features = false, features = ["deflate"] }

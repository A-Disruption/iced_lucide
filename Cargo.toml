[package]
name = "iced_lucide"
version = "0.2.0"
edition = "2024"
description = "Generate type-safe, subsetted icon fonts for `iced` at compile time"
license = "MIT"
repository = "https://github.com/A-Disruption/iced_lucide"
documentation = "https://docs.rs/iced_lucide"
categories = ["gui"]
keywords = ["gui", "ui", "iced", "icons", "fonts"]

# The maintainer tool and the examples are not part of the published crate.
exclude = ["tools/", "all_icons_example/", "subset_example/"]

[features]
default = ["lucide"]

lucide = []
bootstrap = []
codicon = []
devicon = []
fontawesome = []
nerdfonts = []
octicons = []
pomicons = []
material_symbols = []
material_design_icons = []
phosphor = []
tabler = []
fluent = []
simple_icons = []
boxicons = []

# Extra weights and styles. Each is a separate font, so each is its own family
# and its own download — the base feature above stays a single face.
material_symbols_styles = []
phosphor_weights = []
tabler_filled = []
fluent_filled = []

# Everything at once. Convenient for icon browsers; heavy for anything else.
all = [
  "lucide",
  "bootstrap",
  "codicon",
  "devicon",
  "fontawesome",
  "nerdfonts",
  "octicons",
  "pomicons",
  "material_symbols",
  "material_design_icons",
  "phosphor",
  "tabler",
  "fluent",
  "simple_icons",
  "boxicons",
  "material_symbols_styles",
  "phosphor_weights",
  "tabler_filled",
  "fluent_filled",
]

[dependencies]
sha2 = "0.11.0"
serde = { version = "1.0.229", features = ["derive"] }
toml = "1.1.4"
ttf-parser = "0.25"
subsetter = "0.2.6"

[package.metadata.docs.rs]
all-features = true

[workspace]
members = [
  "all_icons_example",
  "icon_picker_example",
  "subset_example",
  "tools/vendor",
]

[workspace.dependencies]
iced_lucide = { version = "0.2.0", path = "." }

iced = { version = "0.15.0-dev", features = [
  "advanced",
] }

# The anchored popover used by icon_picker_example.
widgets = { git = "https://github.com/A-Disruption/widgets", features = [
  "popover",
] }

# The examples and `widgets` both ask for `iced 0.15.0-dev` by version rather
# than by git url, so both resolve through here to one checkout — which is what
# keeps the examples' `Element` the same type as the one the popover returns.
# Pinning the same revision in both crates was the old way of getting that, and
# it meant `widgets` had to be republished before this workspace could move.
#
# Only the examples use iced; the published crate itself does not depend on it,
# and cargo ignores `[patch]` in a dependency's manifest, so nothing here
# reaches anyone who depends on `iced_lucide`. Aim it at another branch, a fork,
# or a local checkout to build the examples against something else.
[patch.crates-io]
iced = { git = "https://github.com/iced-rs/iced.git", branch = "master" }

[dev-dependencies]
# The font database `iced` resolves through, via `cosmic-text`.
fontdb = "0.24.0"
